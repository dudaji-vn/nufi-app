<!doctype html>
<html lang="en">
  <head>
    <base href="/" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <!--
      NuFi: upstream loaded Chivo, Inter and JetBrains Mono from a webfont
      CDN here, with a preconnect to its asset host. Those tags are gone;
      the fonts ship with the app instead -- see the @font-face blocks and
      the reasoning at the top of nufi/brand.css. Do not reinstate them:
      check-brand-css.sh scans the built index.html and fails on either
      host. (Written without naming the hosts on purpose -- HTML comments
      survive minification, so a comment that spelled them out would trip
      that very check.)
    -->
    <script
      src="/node_modules/ace-builds/src-min-noconflict/ace.js"
      type="module"
    ></script>
    <title>NUFI Studio</title>
  </head>
  <body id="body" class="dark" style="width: 100%; height: 100%">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div style="width: 100vw; height: 100vh" id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
