name: console-ci

on:
  pull_request:
    paths: ['apps/console/**']
  push:
    branches: [main]
    paths: ['apps/console/**']

concurrency:
  group: console-ci-${{ github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/console

jobs:
  lint:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate route tree (TanStack Router)
        run: bunx @tanstack/router-cli generate
      - name: Biome
        run: bun run lint
      - name: TypeScript
        run: bun run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Covers the /connect allow-list, which is the only thing standing between
      # the connect flow and a page that walks off with a signed-in user's key.
      - name: Test
        run: bun test
