name: agent-macos

# Build the de-branded NufiBox Agent for macOS as a SIGNED + NOTARIZED universal
# .pkg, and publish it as a release asset the box image can bake in (D2).
#
# Runs on a SELF-HOSTED macOS runner (Dudaji's signing Mac): the Developer ID
# signing keys never leave that machine — they are used in place from the
# keychain, never exported to a CI secret. Notarization uses the stored
# notarytool profile `nufibox-notary`. All Apple contact is at build time; the
# box and the member's Mac never talk to Apple, and the stapled ticket verifies
# offline.
#
# The runner must run in the signing user's GUI session (start it with
# `./run.sh`, not as a background LaunchDaemon) so the login keychain is unlocked
# and codesign / pkgbuild / notarytool can reach the identities and the profile.
# See deploy/box/agent/README-signing.md.
#
# Triggers are dispatch/tag only — NEVER add pull_request: untrusted PR code must
# not run on a self-hosted runner that holds signing keys.

on:
  workflow_dispatch:
    inputs:
      ts_version:
        description: Tailscale engine version to bundle (BSD-3)
        default: "1.102.3"
        required: true
  push:
    tags: ['agent-macos-v*']

permissions:
  contents: write   # create/update the release that carries the .pkg

jobs:
  build:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 60
    env:
      TS_VERSION: ${{ github.event.inputs.ts_version || '1.102.3' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build, sign, notarize, staple
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"   # brew Go + gh on the signing Mac
          # No cert import and no notary key: the Developer ID identities are in
          # this machine's keychain and NOTARY_PROFILE (default nufibox-notary)
          # is stored here. build-agent-macos.sh signs, notarizes and staples.
          bash deploy/box/agent/build-agent-macos.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nufibox-agent-macos
          path: |
            deploy/box/agent/dist/nufibox-agent-macos.pkg
            deploy/box/agent/dist/nufibox-agent-macos.pkg.sha256
          if-no-files-found: error

      - name: Publish as a release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/bin:$PATH"
          TAG="agent-macos-v${TS_VERSION}"
          cd deploy/box/agent/dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" nufibox-agent-macos.pkg nufibox-agent-macos.pkg.sha256 --clobber
          else
            gh release create "$TAG" \
              --title "NufiBox Agent (macOS) $TS_VERSION" \
              --notes "De-branded, signed + notarized NufiBox Agent .pkg for macOS (universal arm64+amd64). Built by the agent-macos workflow on the self-hosted signing Mac; the stapled ticket verifies offline." \
              nufibox-agent-macos.pkg nufibox-agent-macos.pkg.sha256
          fi
