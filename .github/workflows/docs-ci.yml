name: docs-ci

on:
  pull_request:
    paths: ['apps/docs/**', '.github/workflows/docs-ci.yml']

concurrency:
  group: docs-ci-${{ github.ref_name }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/docs

jobs:
  build:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # The docs build is the test. It fails on a missing screenshot, on an MDX
      # syntax error, and on a code-fence language Shiki does not bundle — the
      # last of which produced a stack trace naming the file but not the cause,
      # and was only caught by building locally because nothing ran here.
      - name: Build
        run: bun run build
      # The sidebar model (one tree, Prev/Next across sections, section
      # headers linking to their intro) is enforced by nine browser checks
      # against the served build. A `root: true` slipping back into a
      # meta.json, or a moved page without a redirect, fails here.
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Serve the build
        run: |
          bun run start -- -p 3123 > /tmp/next.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3123/docs/overview && exit 0
            sleep 1
          done
          echo "server did not come up"; cat /tmp/next.log; exit 1
      - name: Navigation checks
        run: bun run check:nav http://localhost:3123
