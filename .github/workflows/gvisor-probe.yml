name: gvisor-probe

# The one check docs/2026-09-16-works-on-box-spike.md could not run: does
# `runsc` start a container under Docker Engine on Ubuntu x86-64, the box's
# actual target? The development machine is Docker Desktop, whose daemon lives
# in a VM; ubuntu-latest here is the real thing. Manual trigger only -- this is
# a probe, not a gate, and it is meant to be run once and read.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Where we are
        run: |
          uname -m
          docker info --format 'server={{.ServerVersion}} os={{.OperatingSystem}} kernel={{.KernelVersion}}'
          echo "runtimes before: $(docker info --format '{{range $k,$v := .Runtimes}}{{$k}} {{end}}')"

      - name: Install runsc as a Docker runtime
        run: |
          set -eux
          ARCH=x86_64
          URL=https://storage.googleapis.com/gvisor/releases/release/latest/${ARCH}
          sudo curl -fsSL -o /usr/local/bin/runsc "${URL}/runsc"
          sudo curl -fsSL -o /usr/local/bin/containerd-shim-runsc-v1 "${URL}/containerd-shim-runsc-v1"
          sudo chmod +x /usr/local/bin/runsc /usr/local/bin/containerd-shim-runsc-v1
          /usr/local/bin/runsc --version
          # Merge, do not clobber: the runner's daemon.json may carry settings.
          sudo python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path('/etc/docker/daemon.json')
          d = json.loads(p.read_text()) if p.exists() else {}
          d.setdefault('runtimes', {})['runsc'] = {'path': '/usr/local/bin/runsc'}
          p.write_text(json.dumps(d, indent=2))
          print(p.read_text())
          PY
          sudo systemctl restart docker
          echo "runtimes after: $(docker info --format '{{range $k,$v := .Runtimes}}{{$k}} {{end}}')"

      - name: The whole test — does dmesg show gVisor's kernel, not the host's?
        run: |
          set -eux
          echo "--- host kernel ---"
          uname -r
          echo "--- inside runc (control) ---"
          docker run --rm alpine:3.20 uname -r
          echo "--- inside runsc ---"
          docker run --rm --runtime=runsc alpine:3.20 uname -r
          docker run --rm --runtime=runsc alpine:3.20 dmesg | head -5
          # gVisor's dmesg opens with its own banner; runc's would show the host's.
          docker run --rm --runtime=runsc alpine:3.20 dmesg | grep -qi 'gvisor' \
            && echo "PASS: the container is running under gVisor" \
            || { echo "FAIL: no gVisor banner -- this is the host kernel"; exit 1; }

      - name: Can a gVisor container do real work? (network, filesystem, a process tree)
        run: |
          set -eux
          docker run --rm --runtime=runsc alpine:3.20 sh -c '
            apk add --no-cache python3 >/dev/null 2>&1 && echo "package install: ok"
            python3 -c "print(\"python under gvisor: ok\")"
            echo hello > /tmp/f && cat /tmp/f
            wget -qO- https://storage.googleapis.com/ >/dev/null && echo "outbound https: ok"
          '

      - name: Does it survive being told there is no route out? (what the egress design relies on)
        run: |
          set -eux
          docker network create --internal probe-isolated
          # No route out: the fetch must fail, quickly, rather than hang.
          if timeout 20 docker run --rm --runtime=runsc --network probe-isolated alpine:3.20 \
               wget -T 5 -qO- https://storage.googleapis.com/ >/dev/null 2>&1; then
            echo "FAIL: an internal network let traffic out"; exit 1
          else
            echo "PASS: on an internal network the sandbox has no route out (fails closed)"
          fi
