name: box-ci

on:
  push:
    branches: [main]
    paths:
      - 'deploy/box/**'
      - 'apps/docs/content/docs/box/**'
      - 'deploy/coordinator/**'
      - 'deploy/platform/scenarios/**'
      - 'deploy/platform/adapters/nufi-ingest/**'
      - 'deploy/platform/adapters/nufi-cron/**'
      - '.github/workflows/box-ci.yml'
  pull_request:
    paths:
      - 'deploy/box/**'
      - 'deploy/coordinator/**'
      - 'deploy/platform/scenarios/**'
      - 'deploy/platform/adapters/nufi-ingest/**'
      - '.github/workflows/box-ci.yml'

permissions:
  contents: read

jobs:
  tests:
    name: Box suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install pytest==8.3.4
      # tests/test_compose.py shells out to `docker compose config`, which only
      # parses files -- no daemon, no network. ubuntu-latest ships the Docker
      # CLI with the compose v2 plugin; this step fails loudly if that ever
      # stops being true, instead of every compose test erroring one by one.
      - name: Check the compose CLI is present
        run: docker compose version
      # install-box.sh and nufi-box are bash 3.2 scripts driven in --dry-run;
      # the compose and Caddyfile tests only read files. Nothing here starts a
      # container, so the whole suite is a few seconds.
      - name: Box suite
        run: python3 -m pytest tests -q
        working-directory: deploy/box
      # Two tests here actually run the pinned headscale image (`configtest`,
      # `policy check`) -- ghcr.io/juanfont/headscale is a public image, so
      # the runner pulls it without auth, same as any other `docker run`.
      - name: Coordinator suite
        run: python3 -m pytest tests -q
        working-directory: deploy/coordinator
      # Stdlib scripts in the deploy/platform/adapters house style: they spin up
      # a ThreadingHTTPServer fake, assert, and exit 0 = PASS. pytest does not
      # collect them (platform-ci's pyproject sets testpaths = ["tests"]), and
      # the box is the only thing that runs them -- so they run here.
      - name: nufi-ingest daemon
        run: python3 deploy/platform/adapters/nufi-ingest/test_ingest.py
      - name: nufi-cron scheduler
        run: python3 deploy/platform/adapters/nufi-cron/test_nufi_cron.py
      - name: works-egress renderer
        run: python3 deploy/box/works-egress/test_render.py
      - name: works adapter file
        run: python3 deploy/box/works/test_adapters.py
      - name: works registrar
        run: python3 deploy/box/works/test_register_works.py
      # Network, unlike everything else here, and deliberately: the published
      # install guide tells the public to fetch deploy/box and run the
      # installer, which carries no docker login. That page is true only while
      # every NuFi image the box pulls is anonymously readable, and a developer
      # machine cannot notice otherwise -- it is already logged in.
      - name: The box's images are public
        run: python3 deploy/box/tests/test_images_public.py
      - name: Box acceptance runner
        run: python3 deploy/platform/scenarios/test_run_box.py
      # Same house style, same paths filter -- and it had never run anywhere.
      # The four routines the box is bought for are built here, and the P2
      # acceptance's defect D2 (nothing bounds a routine's generation) is
      # pinned here, so an unrun suite is a pin that holds nothing.
      - name: Studio routines
        run: python3 deploy/platform/scenarios/studio/test_flows.py

  sandbox-image:
    name: Sandbox image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Built here, for this runner's platform only; box-images publishes the
      # multi-arch one. What is asserted is the contract piece A's provider
      # relies on and nothing else in CI would notice going missing:
      # GNU coreutils' timeout (busybox's cannot signal a process group the
      # way the exec wrapper needs), the harness CLIs on PATH, uid 1000.
      - name: Build
        run: docker build -t nufi-sandbox:ci deploy/box/sandbox
      - name: The image keeps the sandbox contract
        run: |
          set -euo pipefail
          # Captured first, then matched: under pipefail a `| head -1 | grep -q`
          # gate reports head's/grep's exit, not the run's -- the same class of
          # bug fixed in nufi-box doctor's egress and runsc checks.
          v="$(docker run --rm nufi-sandbox:ci timeout --version | head -1)"
          case "$v" in *"GNU coreutils"*) ;; *) echo "not GNU timeout: $v"; exit 1;; esac
          docker run --rm nufi-sandbox:ci sh -c 'id -u' | grep -qx 1000
          docker run --rm nufi-sandbox:ci sh -c 'pwd' | grep -qx /workspace
          # The rootfs is read-only under the provider; the harnesses keep
          # their config under $HOME, so HOME must be the writable workspace.
          docker run --rm nufi-sandbox:ci sh -c 'echo $HOME' | grep -qx /workspace
          for cli in codex claude opencode git node; do
            docker run --rm nufi-sandbox:ci sh -c "command -v $cli" >/dev/null || { echo "$cli not on PATH"; exit 1; }
          done
          echo "PASS: GNU timeout, uid 1000, /workspace, HOME=/workspace, codex claude opencode git node"
