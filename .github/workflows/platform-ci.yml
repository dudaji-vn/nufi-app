name: platform-ci

on:
  push:
    branches: [main]
    paths: ['deploy/platform/**']
  pull_request:
    paths: ['deploy/platform/**']

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: deploy/platform
          config_file: deploy/platform/.yamllint.yml
      - name: Lint Dockerfiles
        run: |
          for f in deploy/platform/litellm/Dockerfile; do
            [ -f "$f" ] || continue
            echo "==> hadolint $f"
            docker run --rm -i hadolint/hadolint:latest < "$f"
          done
      - name: Detect shell scripts
        id: scripts
        run: |
          if [ -n "$(find deploy/platform/scripts -maxdepth 2 -name '*.sh' -print -quit 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Lint shell scripts
        if: steps.scripts.outputs.found == 'true'
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./deploy/platform/scripts
  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Seed .env from .env.example
        run: cp .env.example .env
        working-directory: deploy/platform
      - name: Validate compose syntax
        run: |
          if [ -s docker-compose.yml ]; then
            docker compose config --quiet
          else
            echo "docker-compose.yml is empty — skipping validation"
          fi
        working-directory: deploy/platform
  python:
    name: Python tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install pytest==8.3.4 pytest-asyncio==0.25.2 ruff==0.9.2 litellm==1.83.10 -r litellm/requirements.txt
      - name: Ruff
        run: ruff check .
      # Runs in this job because it needs PyYAML, which the step above installs.
      # A control declared in guardrails/policy.yaml but never wired into
      # litellm/config.yaml is never imported, so nothing inside the proxy can
      # report its absence — this is the only place that mismatch is visible.
      - name: Guardrail wiring
        run: PYTHON=python ./scripts/check-guardrails-wired.sh
      - name: Pytest
        run: python -m pytest -v
  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: [lint, compose, python]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build LiteLLM image
        if: hashFiles('deploy/platform/litellm/Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: ./deploy/platform/litellm
          push: false
          load: true
          tags: npuops/litellm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
