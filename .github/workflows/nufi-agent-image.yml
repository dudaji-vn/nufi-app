name: nufi-agent-image

# The NUFI Studio image. Built here rather than by Railway so the build does
# not have to fit inside a deploy, and so the image that ships is the same one
# a person can pull and inspect.

on:
  push:
    branches: [main]
    paths: ['apps/nufi-agent/**']
    tags: ['nufi-studio-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nufi-studio

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=match,pattern=nufi-studio-(v.+),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/nufi-studio-v') }}
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: apps/nufi-agent
          file: apps/nufi-agent/nufi/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A built image is not evidence of a branded one. The rebrand runs as a
      # Vite plugin, so a build that silently loses the plugin still succeeds
      # and still deploys -- it just ships upstream's name to a customer.
      - name: Assert the shipped image carries the NuFi brand
        run: |
          set -euo pipefail
          tag="$(printf '%s' '${{ steps.meta.outputs.tags }}' | head -1)"
          docker pull "$tag"
          index="/app/src/backend/base/langflow/frontend/index.html"
          nufi="$(docker run --rm "$tag" sh -c "grep -c 'NUFI Studio' $index || true")"
          upstream="$(docker run --rm "$tag" sh -c "grep -ci 'langflow' $index || true")"
          echo "NUFI Studio: $nufi   upstream name: $upstream"
          test "$nufi" -ge 1
          test "$upstream" -eq 0
