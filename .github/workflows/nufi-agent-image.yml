name: nufi-agent-image

# The NUFI Studio image. Built here rather than by Railway so the build does
# not have to fit inside a deploy, and so the image that ships is the same one
# a person can pull and inspect.

on:
  push:
    branches: [main]
    paths: ['apps/nufi-agent/**']
    tags: ['nufi-studio-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nufi-studio

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=match,pattern=nufi-studio-(v.+),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/nufi-studio-v') }}
            type=sha,prefix=sha-,format=short
      # Upstream telemetry POSTs to langflow.gateway.scarf.sh by default,
      # carrying our deployment configuration. The image is pushed straight
      # from buildx and never loaded here, so this asserts the Dockerfile
      # rather than the image -- enough to catch the realistic regression,
      # which is someone editing that line out.
      - name: Assert telemetry is off in the Dockerfile
        run: |
          set -euo pipefail
          grep -q 'DO_NOT_TRACK=true' apps/nufi-agent/nufi/Dockerfile
          grep -q 'LANGFLOW_DO_NOT_TRACK=true' apps/nufi-agent/nufi/Dockerfile
          echo "telemetry disabled in the Dockerfile"

      - uses: docker/build-push-action@v6
        with:
          context: apps/nufi-agent
          file: apps/nufi-agent/nufi/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The brand assertion lives in the Dockerfile itself, so an unbranded
      # image cannot be built at all -- see apps/nufi-agent/nufi/Dockerfile.
      # Checking here instead would mean pulling a 4 GB image back down to
      # inspect something that was already published.
