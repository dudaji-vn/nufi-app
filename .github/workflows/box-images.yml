name: box-images

on:
  push:
    branches: [main]
    paths:
      - 'deploy/platform/litellm/**'
      - 'deploy/platform/adapters/nufi-ingest/**'
      - 'deploy/platform/adapters/nufi-cron/**'
      - 'deploy/box/works-egress/**'
      - 'deploy/box/sandbox/**'
      - 'deploy/box/owner-console/**'
      - 'deploy/box/owner-exec/**'
      - 'deploy/box/lib/join-templates/**'
      - 'deploy/box/agent/**'
      - 'apps/nufi-agent/**'
      - '.github/workflows/box-images.yml'
    tags: ['nufi-box-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nufi-litellm
            context: deploy/platform/litellm
            file: deploy/platform/litellm/Dockerfile
            tagprefix: ''
          - name: nufi-ingest
            context: deploy/platform/adapters/nufi-ingest
            file: deploy/platform/adapters/nufi-ingest/Dockerfile
            tagprefix: ''
          - name: nufi-cron
            context: deploy/platform/adapters/nufi-cron
            file: deploy/platform/adapters/nufi-cron/Dockerfile
            tagprefix: ''
          - name: nufi-works-egress
            context: deploy/box/works-egress
            file: deploy/box/works-egress/Dockerfile
            tagprefix: ''
          - name: nufi-sandbox
            context: deploy/box/sandbox
            file: deploy/box/sandbox/Dockerfile
            tagprefix: ''
          - name: nufi-owner-console
            context: deploy/box/owner-console
            file: deploy/box/owner-console/Dockerfile
            tagprefix: ''
            # The member-connector templates, shared with `nufi-box invite`,
            # supplied as a named build context (the Dockerfile COPY --from it).
            buildcontexts: |
              templates=deploy/box/lib/join-templates
              agent=deploy/box/agent
          - name: nufi-owner-exec
            context: deploy/box
            file: deploy/box/owner-exec/Dockerfile
            tagprefix: ''
          - name: nufi-studio
            context: apps/nufi-agent
            file: apps/nufi-agent/nufi/Dockerfile
            tagprefix: 'box-'
            buildargs: 'VITE_NUFI_ENTER_URL=/nufi/enter/studio'
    steps:
      - uses: actions/checkout@v4
      # The owner-console serves the SIGNED macOS agent .pkg offline. It is built
      # + notarized on the self-hosted signing Mac (the agent-macos workflow) and
      # published as an agent-macos-v* release; fetch the latest into the agent
      # build context so the Dockerfile bakes it in. Best-effort: if no signed
      # release exists yet, the box still builds and /agent/…macos.pkg 404s.
      - name: Fetch the signed macOS agent into the build context
        if: matrix.name == 'nufi-owner-console'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p deploy/box/agent/dist
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName \
                --jq 'map(select(.tagName|startswith("agent-macos-v")))|.[0].tagName // empty')
          if [ -n "$TAG" ]; then
            echo "baking signed macOS agent from release $TAG"
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern 'nufibox-agent-macos.pkg' --dir deploy/box/agent/dist --clobber
          else
            echo "no agent-macos-v* release yet — box will 404 /agent/nufibox-agent-macos.pkg until one is published"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ matrix.tagprefix }}main,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=nufi-box-(v.+),group=1,prefix=${{ matrix.tagprefix }}
            type=sha,prefix=${{ matrix.tagprefix }}sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-contexts: ${{ matrix.buildcontexts }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.buildargs }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
