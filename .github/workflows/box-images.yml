name: box-images

on:
  push:
    branches: [main]
    paths:
      - 'deploy/platform/litellm/**'
      - 'deploy/platform/adapters/nufi-ingest/**'
      - 'apps/nufi-agent/**'
      - '.github/workflows/box-images.yml'
    tags: ['nufi-box-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: nufi-litellm
            context: deploy/platform/litellm
            file: deploy/platform/litellm/Dockerfile
            tagprefix: ''
          - name: nufi-ingest
            context: deploy/platform/adapters/nufi-ingest
            file: deploy/platform/adapters/nufi-ingest/Dockerfile
            tagprefix: ''
          - name: nufi-studio
            context: apps/nufi-agent
            file: apps/nufi-agent/nufi/Dockerfile
            tagprefix: 'box-'
            buildargs: 'VITE_NUFI_ENTER_URL=/nufi/enter/studio'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ matrix.tagprefix }}main,enable=${{ github.ref == 'refs/heads/main' }}
            type=match,pattern=nufi-box-(v.+),group=1,prefix=${{ matrix.tagprefix }}
            type=sha,prefix=${{ matrix.tagprefix }}sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.buildargs }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
