name: agents-image

# The NUFI Works image: upstream's build, with the server-dist rename applied
# on top. ui/dist is branded by a Vite plugin during the upstream build;
# server/dist has no such hook, which is what the second stage is for.

on:
  push:
    branches: [main]
    paths: ['apps/agents/**']
    tags: ['nufi-works-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nufi-works

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=match,pattern=nufi-works-(v.+),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/nufi-works-v') }}
            type=sha,prefix=sha-,format=short

      - name: Build the upstream image
        uses: docker/build-push-action@v6
        with:
          context: apps/agents
          file: apps/agents/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: nufi-works-base:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # nufi/rebrand-server-dist.mjs --check is the authoritative test: it
      # knows the rename only touches STRING LITERALS, and that package names
      # (@paperclipai/*), env vars (PAPERCLIP_*) and class names must survive.
      # A plain `grep -c Paperclip` counts those legitimate survivors and fails
      # a correct image -- which is exactly what it did on the first run.
      #
      # Run against the BASE image first, where it must FAIL. A wrapper that
      # silently did nothing would otherwise be indistinguishable from a
      # working one.
      - name: The base image must fail the rename check
        run: |
          set -euo pipefail
          # `sh -c` because that is the invocation shape already proven to pass
          # through this image's ENTRYPOINT in a previous run.
          if docker run --rm nufi-works-base:ci \
               sh -c 'node nufi/rebrand-server-dist.mjs --check server/dist'; then
            echo "the base image already passes the rename check -- either the"
            echo "upstream build changed or this wrapper has nothing to do"
            exit 1
          fi
          echo "base image needs the rename, as expected"

      # Deliberately NOT docker/build-push-action here. setup-buildx-action
      # provisions a `docker-container` driver, which resolves `FROM` from a
      # registry and cannot see an image the previous step loaded into the
      # daemon -- so `FROM nufi-works-base:ci` fails with "pull access denied".
      # The classic builder reads the daemon, which is exactly what this needs.
      # (A local `docker buildx build` hides this: Docker Desktop's default
      # builder uses the `docker` driver, not `docker-container`.)
      - name: Apply the NuFi rename
        run: |
          set -euo pipefail
          docker build \
            --build-arg BASE=nufi-works-base:ci \
            -f apps/agents/nufi/Dockerfile \
            -t nufi-works:branded \
            apps/agents

      # Asserted before anything is published. Verifying after the push means
      # an image carrying the upstream product name is briefly public and is
      # already what `:main` resolves to.
      - name: Assert the rename took, before publishing
        run: |
          set -euo pipefail
          docker run --rm nufi-works:branded \
            sh -c 'node nufi/rebrand-server-dist.mjs --check server/dist'
          echo "branded image passes the rename check"

      - name: Push every tag
        run: |
          set -euo pipefail
          printf '%s\n' '${{ steps.meta.outputs.tags }}' | while read -r tag; do
            [ -n "$tag" ] || continue
            docker tag nufi-works:branded "$tag"
            docker push "$tag"
          done
