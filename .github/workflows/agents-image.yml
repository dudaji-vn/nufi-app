name: agents-image

# The NUFI Works image: upstream's build, with the server-dist rename applied
# on top. ui/dist is branded by a Vite plugin during the upstream build;
# server/dist has no such hook, which is what the second stage is for.

on:
  push:
    branches: [main]
    paths: ['apps/agents/**']
    tags: ['nufi-works-v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nufi-works

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=match,pattern=nufi-works-(v.+),group=1
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/nufi-works-v') }}
            type=sha,prefix=sha-,format=short

      - name: Build the upstream image
        uses: docker/build-push-action@v6
        with:
          context: apps/agents
          file: apps/agents/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: nufi-works-base:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Asserted before the rename, so a no-op wrapper cannot pass for a
      # working one. This number is what the next step has to erase.
      - name: Show how much of the upstream name is in server/dist
        run: |
          set -euo pipefail
          before="$(docker run --rm nufi-works-base:ci sh -c 'grep -rl Paperclip server/dist | wc -l')"
          echo "files naming the upstream product before the rename: $before"
          test "$before" -gt 0

      # Deliberately NOT docker/build-push-action here. setup-buildx-action
      # provisions a `docker-container` driver, which resolves `FROM` from a
      # registry and cannot see an image the previous step loaded into the
      # daemon -- so `FROM nufi-works-base:ci` fails with "pull access denied".
      # The classic builder reads the daemon, which is exactly what this needs.
      # (A local `docker buildx build` hides this: Docker Desktop's default
      # builder uses the `docker` driver, not `docker-container`.)
      - name: Apply the NuFi rename
        run: |
          set -euo pipefail
          docker build \
            --build-arg BASE=nufi-works-base:ci \
            -f apps/agents/nufi/Dockerfile \
            -t nufi-works:branded \
            apps/agents

      # Asserted before anything is published. Verifying after the push means an
      # image carrying the upstream product name is briefly public and, worse,
      # is already the tag anyone pulling `:main` would get.
      - name: Assert the rename took, before publishing
        run: |
          set -euo pipefail
          after="$(docker run --rm nufi-works:branded sh -c 'grep -rl Paperclip server/dist | wc -l')"
          echo "files naming the upstream product after the rename: $after"
          test "$after" -eq 0

      - name: Push every tag
        run: |
          set -euo pipefail
          printf '%s\n' '${{ steps.meta.outputs.tags }}' | while read -r tag; do
            [ -n "$tag" ] || continue
            docker tag nufi-works:branded "$tag"
            docker push "$tag"
          done
