extends: default

rules:
  line-length:
    max: 140
    level: warning
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: 2
    indent-sequences: consistent

# `litellm/nufi-security/` is a vendored snapshot of another repository
# (litellm/nufi-security.provenance.md). Linting it reports someone else's style
# as our defects -- 175 of them, across their Helm chart, their compose file and
# their own policy presets -- and any fix would be a diff upstream has to carry
# forever. Their CI lints it under their own rules. This mirrors the ruff exclude
# in pyproject.toml, which was added when the snapshot landed; missing it here is
# what turned the first CI run on this branch red.
#
# `**/nufi-security/` and not `litellm/nufi-security/`, and that is not
# cosmetic. yamllint resolves an ignore pattern against the WORKING DIRECTORY,
# not against the directory holding this config, and a pattern containing a
# slash is anchored there (gitignore semantics). CI runs
# `ibiqlik/action-yamllint` from the repository root with
# `file_or_dir: deploy/platform`, so an anchored `litellm/...` matches nothing
# while the same pattern passes locally from inside `deploy/platform`. It did:
# clean here, red there, on the very next run. `**/` matches at any depth and so
# behaves the same from both.
ignore: |-
  node_modules/
  .venv/
  .git/
  **/nufi-security/
  monitoring/grafana/dashboards/
