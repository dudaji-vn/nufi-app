[project]
name = "nufi-platform-guardrails"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["litellm"]
markers = [
    "contract: requires a live sidecar or Presidio; skipped by default",
]
addopts = "-m 'not contract'"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["scripts/e2e"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
