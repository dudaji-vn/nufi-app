name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_file: .yamllint.yml

      - name: Lint Dockerfiles
        # Explicit list — `recursive: true` would also walk into
        # librechat/source/ (the LibreChat submodule), which is upstream
        # code we don't own. Add new Dockerfiles here and in scripts/lint.sh.
        run: |
          for f in litellm/Dockerfile librechat/Dockerfile; do
            [ -f "$f" ] || continue
            echo "==> hadolint $f"
            docker run --rm -i hadolint/hadolint:latest < "$f"
          done

      - name: Detect shell scripts
        id: scripts
        run: |
          if [ -n "$(find scripts -maxdepth 2 -name '*.sh' -print -quit 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint shell scripts
        if: steps.scripts.outputs.found == 'true'
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seed .env from .env.example
        run: cp .env.example .env

      - name: Validate compose syntax
        run: |
          if [ -s docker-compose.yml ]; then
            docker compose config --quiet
          else
            echo "docker-compose.yml is empty — skipping validation"
          fi

  console:
    name: Lint + typecheck console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate route tree (TanStack Router)
        run: bunx @tanstack/router-cli generate

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck

  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: [lint, compose, console]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build LiteLLM image
        if: hashFiles('litellm/Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: ./litellm
          push: false
          load: true
          tags: npuops/litellm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check out LibreChat submodule
        if: hashFiles('librechat/Dockerfile') != ''
        run: git submodule update --init --depth 1 librechat/source

      - name: Build LibreChat image (verifies patches still apply)
        if: hashFiles('librechat/Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: ./librechat
          push: false
          load: true
          tags: npuops/librechat:ci
          build-args: |
            CONSOLE_URL=http://localhost:3001
          cache-from: type=gha,scope=librechat
          cache-to: type=gha,mode=max,scope=librechat
