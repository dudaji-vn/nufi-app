name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_file: .yamllint.yml

      - name: Detect Dockerfiles
        id: dockerfiles
        run: |
          if [ -n "$(find . -name Dockerfile -not -path './.git/*' -print -quit)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint Dockerfiles
        if: steps.dockerfiles.outputs.found == 'true'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true

      - name: Detect shell scripts
        id: scripts
        run: |
          if [ -n "$(find scripts -maxdepth 2 -name '*.sh' -print -quit 2>/dev/null)" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint shell scripts
        if: steps.scripts.outputs.found == 'true'
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seed .env from .env.example
        run: cp .env.example .env

      - name: Validate compose syntax
        run: |
          if [ -s docker-compose.yml ]; then
            docker compose config --quiet
          else
            echo "docker-compose.yml is empty — skipping validation"
          fi

  build:
    name: Build images
    runs-on: ubuntu-latest
    needs: [lint, compose]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build LiteLLM image
        if: hashFiles('litellm/Dockerfile') != ''
        uses: docker/build-push-action@v5
        with:
          context: ./litellm
          push: false
          load: true
          tags: npuops/litellm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
