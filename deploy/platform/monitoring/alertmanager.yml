# Alertmanager config.
#
# Slack is wired but disabled by default — alerts route to `noop` until
# someone provides a webhook URL.
#
# To enable Slack:
#   1. cp monitoring/secrets/slack-webhook.example monitoring/secrets/slack-webhook
#   2. paste your Slack incoming webhook URL into that file (single line, no
#      shell quoting)
#   3. change `route.receiver` below from `noop` to `slack`
#   4. docker compose restart alertmanager
#
# `api_url_file` is read at notification time, not config-load time, so the
# slack receiver block below is safe to keep even when the secret file
# doesn't exist yet.

route:
  # Switch to `slack` once the secret file is in place. See instructions above.
  receiver: noop
  group_by: [alertname, severity]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    # Critical alerts always go to slack regardless of the default receiver.
    # No-op until route.receiver is also `slack` AND the secret exists.
    - matchers: ['severity = "critical"']
      receiver: slack
      continue: false

receivers:
  - name: noop

  - name: slack
    slack_configs:
      - api_url_file: /etc/alertmanager/secrets/slack-webhook
        channel: "#npuops-alerts"
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔥{{ else }}✅{{ end }} {{ .GroupLabels.alertname }} ({{ .Status }})'
        text: |-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}
