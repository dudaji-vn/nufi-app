# Prometheus scrape config for NPUOps.
#
# Targets resolve over the `npuops` docker network (service-name DNS).
# Rule files are mounted at /etc/prometheus/rules — Day 2 will populate
# this directory with litellm.rules.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: litellm
    # LiteLLM redirects bare /metrics to /metrics/ (HTTP 307). Pinning the
    # trailing slash here saves Prometheus a redirect on every scrape.
    metrics_path: /metrics/
    static_configs:
      - targets: [litellm-proxy:4000]

  - job_name: postgres
    static_configs:
      - targets: [postgres-exporter:9187]

  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
