# Auto-provision Prometheus as the default Grafana datasource so dashboards
# don't need a manual setup step on a fresh volume.

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # Pin the UID so dashboards in monitoring/grafana/dashboards/ can
    # reference it without a templated datasource variable.
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
