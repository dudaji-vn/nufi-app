# Auto-load any dashboard JSON dropped into ./monitoring/grafana/dashboards/.
# Day 2 commits litellm-overview.json here.

apiVersion: 1

providers:
  - name: NPUOps
    folder: ""
    type: file
    disableDeletion: true
    editable: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
