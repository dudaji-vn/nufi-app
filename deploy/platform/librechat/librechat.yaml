# =============================================================================
# librechat.yaml — LibreChat configuration
# Reference: https://www.librechat.ai/docs/configuration/librechat_yaml
# =============================================================================

version: 1.2.1

# Cache parsed config in memory (faster restarts).
cache: true

# UI / branding overrides. App name, logo and favicon come from env / assets.
interface:
  privacyPolicy:
    externalUrl: ''
  termsOfService:
    externalUrl: ''

# Endpoints — only one for W2: route everything through the LiteLLM proxy.
endpoints:
  custom:
    - name: 'NPUOps'
      # ${LITELLM_MASTER_KEY} is interpolated at runtime from the container env
      apiKey: '${LITELLM_MASTER_KEY}'
      # Internal compose hostname; the proxy listens on :4000
      baseURL: 'http://litellm-proxy:4000/v1'
      models:
        # Models shown in the LibreChat dropdown.
        # `default` is the explicit display list (also acts as fallback when
        # fetch fails or is cached). Add new model_names here when you add
        # them to litellm/config.yaml.
        default: ['llama-3-gpu', 'llava-vision']
        fetch: true
      titleConvo: true
      titleModel: 'llama-3-gpu'
      modelDisplayLabel: 'NPUOps'
      forcePrompt: false
      summarize: false

# File uploads. Required for the multimodal flow (drag-drop an image into
# the chat → goes to llava-vision via LiteLLM as image_url content).
fileConfig:
  endpoints:
    NPUOps:
      fileLimit: 5
      fileSizeLimit: 20      # MB per file
      totalSizeLimit: 50     # MB per request
      supportedMimeTypes:
        - 'image/png'
        - 'image/jpeg'
        - 'image/webp'
        - 'image/gif'
