name: NuFi PII Scan

# CMP-295: PR 별 PII 스캔 + 결과 PR 코멘트 자동 게시.
# 사용법: 이 파일을 .github/workflows/ 에 복사하거나 examples/ci-github-actions.yml 을 참조.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  nufi-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install NuFi
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: NuFi PII scan (SARIF)
        id: scan
        run: |
          set +e
          nufi-egress scan . --profile ci --format sarif > nufi-results.sarif 2>&1
          SCAN_EXIT=$?
          echo "exit_code=$SCAN_EXIT" >> "$GITHUB_OUTPUT"

          # 사람 읽기용 요약도 생성
          nufi-egress scan . --profile ci --count-only > nufi-summary.txt 2>&1 || true
          exit 0

      - name: Post scan results as PR comment
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let summary = '';
            try {
              summary = fs.readFileSync('nufi-summary.txt', 'utf8').trim();
            } catch (e) {
              summary = '(요약 생성 실패)';
            }

            const exitCode = '${{ steps.scan.outputs.exit_code }}';
            const status = exitCode === '0' ? '✅ PASS' : '❌ FAIL';
            const icon = exitCode === '0' ? '🟢' : '🔴';

            const body = [
              `## ${icon} NuFi PII Scan — ${status}`,
              '',
              '```',
              summary,
              '```',
              '',
              exitCode !== '0'
                ? '> **PII 가 감지되었습니다.** 개인정보를 제거하거나 가명화한 후 다시 푸시하세요.'
                : '> 개인정보(PII) 미감지 — 안전합니다.',
              '',
              `<details><summary>스캔 설정</summary>`,
              '',
              '- Profile: `ci`',
              '- Min severity: `medium`',
              '- Injection check: enabled',
              `- Python: \`$\{process.env.PYTHON_VERSION || '3.12'}\``,
              '',
              '</details>',
            ].join('\n');

            // 기존 NuFi 코멘트가 있으면 업데이트, 없으면 새로 생성
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '## 🟢 NuFi PII Scan';
            const marker2 = '## 🔴 NuFi PII Scan';
            const existing = comments.find(c =>
              c.body.startsWith(marker) || c.body.startsWith(marker2)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if PII detected
        if: steps.scan.outputs.exit_code != '0'
        run: |
          echo "::error::NuFi PII scan failed — PII detected in codebase"
          exit 1
