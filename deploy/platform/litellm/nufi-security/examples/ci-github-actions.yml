# Example GitHub Actions workflow for NuFi PII scanning.
# CMP-295: PR 별 PII 스캔 + 결과 PR 코멘트 자동 게시.
#
# 실제 워크플로는 .github/workflows/nufi-scan.yml 참조.
# 이 파일은 외부 프로젝트에서 복사해 쓸 수 있는 간결한 예시입니다.

name: NuFi Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install NuFi
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: NuFi PII scan
        id: scan
        run: |
          set +e
          nufi-egress scan . --fail-on-pii --pattern "*.py,*.md,*.txt"
          SCAN_EXIT=$?
          echo "exit_code=$SCAN_EXIT" >> "$GITHUB_OUTPUT"

          nufi-egress scan . --count-only > nufi-summary.txt 2>&1 || true
          exit 0

      - name: Post scan results as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '';
            try { summary = fs.readFileSync('nufi-summary.txt', 'utf8').trim(); }
            catch (e) { summary = '(요약 생성 실패)'; }

            const exitCode = '${{ steps.scan.outputs.exit_code }}';
            const icon = exitCode === '0' ? '✅' : '❌';
            const status = exitCode === '0' ? 'PASS' : 'FAIL';

            const body = `## ${icon} NuFi PII Scan — ${status}\n\n\`\`\`\n${summary}\n\`\`\`\n\n${
              exitCode !== '0'
                ? '> **PII 감지됨.** 개인정보를 제거하거나 가명화 후 다시 푸시하세요.'
                : '> PII 미감지 — 안전합니다.'
            }`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: NuFi environment doctor check
        run: nufi-egress doctor
        continue-on-error: false

      - name: Fail if PII detected
        if: steps.scan.outputs.exit_code != '0'
        run: exit 1
