# =============================================================================
# LiteLLM Proxy config — NPUOps Platform
#
# Conventions (from CLAUDE.md):
#   - `model_info.backend_type: gpu | npu` MUST be present from W1 so the
#     W8 NPU integration is a config edit, not a refactor.
#   - `model_info.hardware_id` MUST be present so W6 reports can aggregate
#     per hardware unit.
# =============================================================================

model_list:
  # ---------------------------------------------------------------------------
  # GPU models — active from W1
  # ---------------------------------------------------------------------------
  - model_name: llama-3-gpu
    litellm_params:
      model: os.environ/GPU_MODEL
      api_base: os.environ/GPU_BACKEND_BASE_URL
      api_key: os.environ/GPU_BACKEND_API_KEY
      input_cost_per_token: 0.00000020
      output_cost_per_token: 0.00000060
    model_info:
      backend_type: gpu
      hardware_id: os.environ/GPU_HARDWARE_ID

  # ---------------------------------------------------------------------------
  # NPU models — placeholder, uncomment in W8 once gom delivers the backend
  # ---------------------------------------------------------------------------
  # - model_name: llama-3-npu
  #   litellm_params:
  #     model: openai/llama-3-8b
  #     api_base: os.environ/NPU_BACKEND_BASE_URL
  #     api_key: os.environ/NPU_BACKEND_API_KEY
  #     input_cost_per_token: 0.00000005
  #     output_cost_per_token: 0.00000015
  #   model_info:
  #     backend_type: npu
  #     hardware_id: os.environ/NPU_HARDWARE_ID

router_settings:
  # W1: simple round-robin across replicas of the same model_name.
  # W8: switch to `weighted-pick` so the Canary slider can split GPU/NPU traffic.
  routing_strategy: simple-shuffle
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD

litellm_settings:
  request_timeout: 600
  drop_params: true
  # success_callback / failure_callback are added in W1 Task 1.2 (Langfuse)

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
