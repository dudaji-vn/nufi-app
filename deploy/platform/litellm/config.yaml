# =============================================================================
# LiteLLM Proxy config — NPUOps Platform
#
# Conventions (from CLAUDE.md):
#   - `model_info.backend_type: gpu | npu | cloud` MUST be present so the
#     NPU integration is a config edit, not a refactor.
#   - `model_info.hardware_id` MUST be present so cost / usage reports can
#     aggregate per hardware unit.
# =============================================================================

# Models are registered by `./scripts/add-model.sh` (which appends to this list
# and restarts the proxy + LibreChat). Edit by hand only if the script can't
# express what you need.
#
# Reference shape — every entry MUST set backend_type and hardware_id:
#   - model_name: my-model
#     litellm_params:
#       model: openai/<upstream-id>            # provider prefix is required;
#                                              # use a native one (gemini/,
#                                              # anthropic/, cohere/, …) to
#                                              # talk directly to that cloud
#       api_base: os.environ/<URL_VAR>         # required for OpenAI-compatible
#                                              # backends; OMIT for native
#                                              # providers (LiteLLM has the
#                                              # endpoint built in)
#       api_key:  os.environ/<KEY_VAR>         # or an inline key
#       input_cost_per_token:  0.00000020      # required for OpenAI-compatible
#       output_cost_per_token: 0.00000060      # backends (LiteLLM can't know
#                                              # what your local Ollama costs).
#                                              # OMIT for native providers —
#                                              # LiteLLM ships a model-cost map
#                                              # and a manual override here will
#                                              # silently mis-report Langfuse
#                                              # cost. Override only if your
#                                              # contract pricing differs.
#     model_info:
#       backend_type: gpu                      # gpu | npu | cloud
#       hardware_id: gpu-node-01               # used by cost / usage reports
#       supports_vision: false                 # set true for multimodal models
model_list:
  # Registered here rather than only in the LiteLLM DB so a redeploy or a host
  # migration reproduces the gateway's model set. `store_model_in_db: true`
  # below still applies to anything added from the admin UI.
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      backend_type: cloud
      hardware_id: gemini-cloud
      supports_vision: false
  # A `gemini-2.5-flash-title` alias used to live here so policy.yaml could
  # exempt title generation from G1. Removed 2026-08-03: measured on the
  # production gateway with G1 enforcing and titles on the guarded model, titles
  # generated normally because `require_corroboration: [user]` stops the
  # classifier acting alone. Registering it again would put a model that skips
  # G1 entirely into the dropdown the moment its team is granted access.
router_settings:
  # Simple round-robin across replicas of the same model_name. Switch to
  # `weighted-pick` later so the Canary slider can split GPU/NPU traffic.
  routing_strategy: simple-shuffle
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
litellm_settings:
  request_timeout: 600
  drop_params: true
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  # `callbacks` accepts a mixed list: built-in logger names ("prometheus")
  # and dotted paths to custom Python proxy-handler instances.
  #   - prometheus: exposes /metrics on the proxy's port 4000 (scraped by
  #     monitoring/prometheus.yml). OSS, ships in the docker image.
  #   - hardware_metadata: pre-call hook that stamps hardware_id +
  #     backend_type onto every Langfuse trace. Needed because LiteLLM's
  #     `langfuse_default_tags` resolver silently drops custom keys.
  #
  # Prompt-injection detection is NOT a callback any more: it is a registered
  # guardrail (see the `guardrails:` block at the end of this file), so it can
  # be reconciled against guardrails/policy.yaml from outside the process.
  callbacks:
    - prometheus
    - callbacks.hardware_metadata.proxy_handler_instance
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

# --- Guardrails -------------------------------------------------------------
# Policy (thresholds, fail behaviour, enforcement mode) lives in
# guardrails/policy.yaml, not here. All controls start in logging_only; flip a
# control's `mode` in policy.yaml to enforce. Design:
# docs/2026-07-27-llm-security-gateway-design.md
#
# `guardrail:` names a CLASS, not a module-level instance. Verified against the
# installed litellm==1.83.10 source: guardrail_registry.py's
# `initialize_custom_guardrail` resolves the dotted path with `get_instance_fn`
# into a local it calls `_guardrail_class`, then CALLS it —
# `_guardrail_class(guardrail_name=..., event_hook=mode, default_on=..., **extra)`.
# CustomGuardrail defines no `__call__`, so pointing this at
# `guardrails.entrypoints.g1_injection` (the module-level instance) raises
# TypeError at boot and the proxy serves zero guardrails.
#
# ./scripts/check-guardrails-wired.sh reconciles this block against
# guardrails/policy.yaml in both directions, because a control declared there
# and missing here is never imported and therefore cannot report its own
# absence. It also rejects the quieter ways an entry can be present and still
# never run: a `default_on` that is not literally true, a `mode` that
# disagrees with the control's declared hook, a target class that does not
# exist, and a class that implements no hook method. Each of those loads,
# gauges and logs exactly like a healthy control while inspecting nothing.
guardrails:
  - guardrail_name: nufi-g1-injection
    litellm_params:
      guardrail: guardrails.entrypoints.G1Injection
      mode: pre_call
      default_on: true
  - guardrail_name: nufi-g2a-pii-input
    litellm_params:
      guardrail: guardrails.entrypoints.G2aPiiInput
      mode: pre_call
      default_on: true
  - guardrail_name: nufi-g2b-pii-output
    litellm_params:
      guardrail: guardrails.entrypoints.G2bPiiOutput
      mode: post_call
      default_on: true
  - guardrail_name: nufi-g3-system-prompt-leak
    litellm_params:
      guardrail: guardrails.entrypoints.G3SystemPromptLeak
      mode: post_call
      default_on: true
  - guardrail_name: nufi-g4-output-handling
    litellm_params:
      guardrail: guardrails.entrypoints.G4OutputHandling
      mode: post_call
      default_on: true
