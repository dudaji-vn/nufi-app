# =============================================================================
# LiteLLM Proxy config — NPUOps Platform
#
# Conventions (from CLAUDE.md):
#   - `model_info.backend_type: gpu | npu | cloud` MUST be present so the
#     NPU integration is a config edit, not a refactor.
#   - `model_info.hardware_id` MUST be present so cost / usage reports can
#     aggregate per hardware unit.
# =============================================================================

# Models are registered by `./scripts/add-model.sh` (which appends to this list
# and restarts the proxy + LibreChat). Edit by hand only if the script can't
# express what you need.
#
# Reference shape — every entry MUST set backend_type and hardware_id:
#   - model_name: my-model
#     litellm_params:
#       model: openai/<upstream-id>            # provider prefix is required;
#                                              # use a native one (gemini/,
#                                              # anthropic/, cohere/, …) to
#                                              # talk directly to that cloud
#       api_base: os.environ/<URL_VAR>         # required for OpenAI-compatible
#                                              # backends; OMIT for native
#                                              # providers (LiteLLM has the
#                                              # endpoint built in)
#       api_key:  os.environ/<KEY_VAR>         # or an inline key
#       input_cost_per_token:  0.00000020      # required for OpenAI-compatible
#       output_cost_per_token: 0.00000060      # backends (LiteLLM can't know
#                                              # what your local Ollama costs).
#                                              # OMIT for native providers —
#                                              # LiteLLM ships a model-cost map
#                                              # and a manual override here will
#                                              # silently mis-report Langfuse
#                                              # cost. Override only if your
#                                              # contract pricing differs.
#     model_info:
#       backend_type: gpu                      # gpu | npu | cloud
#       hardware_id: gpu-node-01               # used by cost / usage reports
#       supports_vision: false                 # set true for multimodal models
model_list: []
router_settings:
  # Simple round-robin across replicas of the same model_name. Switch to
  # `weighted-pick` later so the Canary slider can split GPU/NPU traffic.
  routing_strategy: simple-shuffle
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT
  redis_password: os.environ/REDIS_PASSWORD
litellm_settings:
  request_timeout: 600
  drop_params: true
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  # `callbacks` accepts a mixed list: built-in logger names ("prometheus")
  # and dotted paths to custom Python proxy-handler instances.
  #   - prometheus: exposes /metrics on the proxy's port 4000 (scraped by
  #     monitoring/prometheus.yml). OSS, ships in the docker image.
  #   - hardware_metadata: pre-call hook that stamps hardware_id +
  #     backend_type onto every Langfuse trace. Needed because LiteLLM's
  #     `langfuse_default_tags` resolver silently drops custom keys.
  #   - prompt_injection: pre-call hook that POSTs each user prompt to
  #     llm-guard-api and fails-closed on detected injection. Stamps
  #     scanner scores onto trace metadata for dashboarding.
  callbacks:
    - prometheus
    - callbacks.hardware_metadata.proxy_handler_instance
    # Temporarily disabled while the Korean team's AI gateway is in flight —
    # self-testing the chat interface only. Re-enable when the gateway lands.
    # - callbacks.prompt_injection.proxy_handler_instance
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

# --- Guardrails (W5.1) -----------------------------------------------------
# Presidio sidecars do PII detection + anonymisation. `default_on: true` means
# every request is scanned without the caller having to opt in via the
# `guardrails: [...]` request param — this is the right default for a
# self-hosted GPU/NPU platform aimed at internal teams.
#
# `presidio_filter_scope: both` masks PII in BOTH the user's prompt before it
# reaches the model AND the model's response before it reaches the user.
# Threshold of 0.5 is Presidio's documented sweet spot — below that you get
# false positives on common nouns; above 0.7 you start missing edge cases.
#
# To add or remove entity types, edit pii_entities_config below. Full list:
# https://microsoft.github.io/presidio/supported_entities/
guardrails:
  - guardrail_name: presidio-mask-pii
    litellm_params:
      guardrail: presidio
      mode: pre_call
      # Temporarily off: Presidio was masking PERSON/EMAIL on input, which
      # made the model reply to placeholders like `<PERSON>` instead of the
      # actual prompt. Flip back to true once the Korean team's AI gateway
      # is wired up.
      default_on: false
      presidio_language: en
      presidio_filter_scope: input
      presidio_score_thresholds:
        ALL: 0.5
        CREDIT_CARD: 0.7
        US_SSN: 0.7
      pii_entities_config:
        EMAIL_ADDRESS: MASK
        PHONE_NUMBER: MASK
        US_SSN: MASK
        CREDIT_CARD: MASK
        IP_ADDRESS: MASK
        PERSON: MASK
        LOCATION: MASK
