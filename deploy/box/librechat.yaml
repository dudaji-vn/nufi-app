version: 1.3.11
cache: true

interface:
  customWelcome: "Welcome to your NuFi box. Documents in a department drive become that department's knowledge."
  # Visible so people can switch to the Agents endpoint, where File Search lives.
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  temporaryChat: true
  agents: true
  # customConsole / customAgents are the product-switcher doors to the box's
  # Console and Agent Studio, served at ${BOX_HOST}:3001. Disabled: that host
  # (e.g. nufi.local) does not resolve for a mesh member reaching the box from
  # another network, so the nav entry was a dead link cross-network, and the
  # console's SSO is pinned to that one hostname anyway. Re-enable for a LAN-only
  # box, or after the coordinator-hostname / OIDC-issuer rework lands.
  # customConsole:
  #   externalUrl: ${CONSOLE_URL}
  #   openNewTab: true
  # customAgents:
  #   externalUrl: ${AGENTS_URL}
  #   openNewTab: true

endpoints:
  custom:
    - name: "NuFi"
      apiKey: "${LITELLM_MASTER_KEY}"
      baseURL: "http://litellm-proxy:4000/v1"
      models:
        fetch: true
        # Zod requires min(1); the real list comes from /v1/models.
        default: ["${NUFI_MODEL}"]
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "NuFi"
      forcePrompt: false
      summarize: false
  agents:
    # No "actions": an action lets an agent POST to an arbitrary external URL,
    # which is a data-egress path off the box. Department assistants answer from
    # the drives (file_search) and need none. Dropping the capability keeps box
    # data on the box — the AI-path side of the mesh-only data-sovereignty rule.
    # (A strict air-gap deployment also drops "tools" and blocks container egress
    # at the network; those are separate, larger steps.)
    capabilities: ["file_search", "tools"]

fileConfig:
  endpoints:
    NuFi:
      fileLimit: 10
      fileSizeLimit: 50
      totalSizeLimit: 200
      supportedMimeTypes:
        - "image/png"
        - "image/jpeg"
        - "image/webp"
        - "image/gif"
        - "application/pdf"
        - "text/plain"
        - "text/markdown"
        - "text/csv"
        - "application/json"
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        - "application/vnd.openxmlformats-officedocument.presentationml.presentation"
        - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
