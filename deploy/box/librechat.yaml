version: 1.3.11
cache: true

interface:
  customWelcome: "Welcome to your NuFi box. Documents in a department drive become that department's knowledge."
  # Visible so people can switch to the Agents endpoint, where File Search lives.
  endpointsMenu: true
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  temporaryChat: true
  agents: true
  customConsole:
    externalUrl: ${CONSOLE_URL}
    openNewTab: true
  customAgents:
    externalUrl: ${AGENTS_URL}
    openNewTab: true

endpoints:
  custom:
    - name: "NuFi"
      apiKey: "${LITELLM_MASTER_KEY}"
      baseURL: "http://litellm-proxy:4000/v1"
      models:
        fetch: true
        # Zod requires min(1); the real list comes from /v1/models.
        default: ["${NUFI_MODEL}"]
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "NuFi"
      forcePrompt: false
      summarize: false
  agents:
    capabilities: ["file_search", "tools", "actions"]

fileConfig:
  endpoints:
    NuFi:
      fileLimit: 10
      fileSizeLimit: 50
      totalSizeLimit: 200
      supportedMimeTypes:
        - "image/png"
        - "image/jpeg"
        - "image/webp"
        - "image/gif"
        - "application/pdf"
        - "text/plain"
        - "text/markdown"
        - "text/csv"
        - "application/json"
        - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
        - "application/vnd.openxmlformats-officedocument.presentationml.presentation"
        - "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
