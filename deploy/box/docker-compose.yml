name: nufi-box

networks:
  box:
    driver: bridge
  # Where every Works sandbox lives. `internal: true` is the whole fail-closed
  # argument: nothing on this network has a route out unless it is also on
  # `box`, and the only member that is, is works-egress. The literal `name:`
  # matters -- the sandbox provider hard-codes "works-sandbox" (its
  # SANDBOX_NETWORK constant), and without it compose would create
  # nufi-box_works-sandbox and every sandbox would fail to start.
  works-sandbox:
    name: works-sandbox
    driver: bridge
    internal: true

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  mongodb-data:
  app-uploads:
  studio-data:
  ingest-state:
  cron-state:
  # Works' instance state (PAPERCLIP_HOME): plugin records, adapter registrations, logs.
  works-data:

# Container logs, bounded.
#
# Docker's default json-file driver has no size limit, so an appliance that
# runs for months writes until the disk is full -- and this box has already
# been there once. 20 MB x 3 per service is a few days of ordinary chatter and
# enough history to answer "did that laptop ever reach us".
x-logging: &box-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------------
  # TLS front. One hostname, several ports; internal CA. Laptops trust the root
  # once (served on http://<box>/ by the landing page). The network alias lets
  # containers reach https://${BOX_HOST}:3001 through Caddy, which Studio needs
  # for the console's JWKS.
  # ---------------------------------------------------------------------------
  caddy:
    logging: *box-logging
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      BOX_HOST: ${BOX_HOST}
      BOX_IP: ${BOX_IP}
    ports:
      - "80:80"
      - "3080:3080"
      - "3001:3001"
      - "3002:3002"
      - "3003:3003"
      - "7860:7860"
      - "4000:4000"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/landing:/srv/landing:ro
      # The Caddyfile's `import caddy/mesh*.caddy` is resolved relative to the
      # config file, so ./caddy has to appear inside /etc/caddy. A directory
      # mount, not a file one: `nufi-box mesh up` rewrites caddy/mesh.caddy on
      # the host, and a bind-mounted *file* would keep the old inode.
      - ./caddy:/etc/caddy/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      box:
        aliases:
          - "${BOX_HOST}"

  postgres:
    logging: *box-logging
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nufi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nufi
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/10-box-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nufi -d nufi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [box]

  mongodb:
    logging: *box-logging
    # 4.4 is the last release that runs on CPUs without AVX; ships the legacy
    # `mongo` shell (no mongosh), which the healthcheck and installer use.
    image: mongo:4.4
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: nufi
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand({ping: 1}).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [box]

  litellm-proxy:
    logging: *box-logging
    image: ${NUFI_REGISTRY:-ghcr.io/dudaji-vn}/nufi-litellm:${NUFI_LITELLM_TAG}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      DATABASE_URL: postgresql://nufi:${POSTGRES_PASSWORD}@postgres:5432/nufi
      INFERENCE_BASE_URL: ${INFERENCE_BASE_URL}
      INFERENCE_API_KEY: ${INFERENCE_API_KEY}
      GUARDRAIL_POLICY_PATH: /app/guardrails/policy.yaml
    volumes:
      # Rendered by the installer from litellm/config.yaml.tmpl; the image bakes
      # a config that needs GEMINI_API_KEY, so the box must override it.
      - ./litellm/config.yaml:/app/config.yaml:ro
      - ./litellm/policy.yaml:/app/guardrails/policy.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health/liveliness\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [box]

  librechat:
    logging: *box-logging
    image: ${NUFI_REGISTRY:-ghcr.io/dudaji-vn}/nufichat:${NUFI_CHAT_TAG}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      litellm-proxy:
        condition: service_healthy
      rag_api:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: mongodb://nufi:${MONGO_PASSWORD}@mongodb:27017/LibreChat?authSource=admin
      DOMAIN_CLIENT: https://${BOX_HOST}:3080
      DOMAIN_SERVER: https://${BOX_HOST}:3080
      TRUST_PROXY: "1"
      APP_TITLE: NuFi
      ALLOW_REGISTRATION: "false"
      ALLOW_EMAIL_LOGIN: "true"
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CREDS_KEY: ${CREDS_KEY}
      CREDS_IV: ${CREDS_IV}
      ENDPOINTS: custom,agents
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      RAG_API_URL: http://rag_api:8000
      CONSOLE_URL: https://${BOX_HOST}:3001
      AGENTS_URL: https://${BOX_HOST}:3001/choose
      NUFI_MODEL: ${NUFI_MODEL}
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - app-uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [box]

  rag_api:
    logging: *box-logging
    image: ${NUFI_RAG_IMAGE}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RAG_PORT: "8000"
      RAG_HOST: "0.0.0.0"
      DB_HOST: postgres
      DB_PORT: "5432"
      POSTGRES_DB: nufi_rag
      POSTGRES_USER: nufi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      EMBEDDINGS_PROVIDER: ollama
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [box]

  # ---------------------------------------------------------------------------
  # Products behind the one hostname. The console is the identity authority:
  # it verifies the chat cookie server-side and mints the Studio identity JWT.
  # ---------------------------------------------------------------------------
  console:
    logging: *box-logging
    image: ${NUFI_REGISTRY:-ghcr.io/dudaji-vn}/nufi-console:${NUFI_CONSOLE_TAG}
    restart: unless-stopped
    depends_on:
      litellm-proxy:
        condition: service_healthy
      librechat:
        condition: service_healthy
    environment:
      PORT: 3000
      LITELLM_BASE_URL: http://litellm-proxy:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Identity: verify the chat cookie server-side, send browsers to chat login.
      CHAT_BASE_URL: http://librechat:3080
      CHAT_PUBLIC_URL: https://${BOX_HOST}:3080
      # Studio handoff. Empty cookie domain = host-only, shared across ports.
      OIDC_ISSUER: https://${BOX_HOST}:3001
      OIDC_PRIVATE_KEY_PEM: ${OIDC_PRIVATE_KEY_PEM}
      STUDIO_URL: https://${BOX_HOST}:7860
      IDENTITY_COOKIE_DOMAIN: ""
      # Runtime public URLs. PUBLIC_WORKS_URL is empty on a box without Works;
      # install-box.sh --with-works sets WORKS_PUBLIC_URL and the chooser gets
      # its third door.
      PUBLIC_WORKS_URL: ${WORKS_PUBLIC_URL:-}
      # Works is an OIDC client of this console, the same way it is in the
      # cloud (deploy/railway/agents.md). Registered on every box -- the secret
      # is generated by the installer whether or not Works is installed -- so a
      # box that turns Works on later needs no console change.
      OIDC_CLIENTS: '[{"clientId":"nufi-works","clientSecret":"${WORKS_OIDC_SECRET}","redirectUris":["https://${BOX_HOST}:3003/api/auth/oauth2/callback/nufi"],"product":"works"}]'
      PUBLIC_CHAT_URL: https://${BOX_HOST}:3080
      PUBLIC_LITELLM_URL: https://${BOX_HOST}:4000
      DEFAULT_USER_BUDGET: "1000000"
      DEFAULT_BUDGET_DURATION: 30d
      DEFAULT_TPM_LIMIT: "200000"
      DEFAULT_RPM_LIMIT: "600"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/_health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [box]

  admin-panel:
    logging: *box-logging
    image: ${NUFI_REGISTRY:-ghcr.io/dudaji-vn}/nufichat-admin-panel:${NUFI_ADMIN_TAG}
    restart: unless-stopped
    depends_on:
      librechat:
        condition: service_healthy
    environment:
      PORT: 3000
      SESSION_SECRET: ${ADMIN_SESSION_SECRET}
      API_SERVER_URL: http://librechat:3080
      VITE_API_BASE_URL: https://${BOX_HOST}:3080
      SESSION_COOKIE_SECURE: "true"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [box]

  studio:
    logging: *box-logging
    image: ${NUFI_REGISTRY:-ghcr.io/dudaji-vn}/nufi-studio:${NUFI_STUDIO_TAG}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      caddy:
        condition: service_healthy
      console:
        condition: service_healthy
    environment:
      PORT: 7860
      LANGFLOW_DATABASE_URL: postgresql://nufi:${POSTGRES_PASSWORD}@postgres:5432/nufi_studio
      LANGFLOW_SECRET_KEY: ${LANGFLOW_SECRET_KEY}
      LANGFLOW_AUTO_LOGIN: "false"
      LANGFLOW_SUPERUSER: ${ADMIN_EMAIL}
      LANGFLOW_SUPERUSER_PASSWORD: ${STUDIO_SUPERUSER_PASSWORD}
      LANGFLOW_EXTERNAL_AUTH_ENABLED: "true"
      LANGFLOW_EXTERNAL_AUTH_TOKEN_COOKIE: nufi_id
      LANGFLOW_EXTERNAL_AUTH_JWKS_URL: https://${BOX_HOST}:3001/.well-known/jwks.json
      LANGFLOW_EXTERNAL_AUTH_ISSUER: https://${BOX_HOST}:3001
      LANGFLOW_EXTERNAL_AUTH_AUDIENCE: nufi-studio
      LANGFLOW_EXTERNAL_AUTH_SUBJECT_CLAIM: sub
      LANGFLOW_EXTERNAL_AUTH_EMAIL_CLAIM: email
      LANGFLOW_EXTERNAL_AUTH_ACCESS_CEILING_ENABLED: "true"
      LANGFLOW_EXTERNAL_AUTH_ACCESS_CLAIM: access
      LANGFLOW_EXTERNAL_AUTH_DEFAULT_ACCESS_LEVEL: editor
      # The JWKS is fetched through Caddy's internal CA; trust it alongside the
      # public roots (SSL_CERT_FILE replaces certifi's bundle, so it must point
      # at the merged system bundle, not at root.crt alone).
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      # Langflow's SSRF guard blocks any hostname resolving to a private
      # address, which is every model host a box has: on macOS the model runs
      # natively and is reached at host.docker.internal (a link-local gateway
      # address), on Linux it is the `ollama` container on this network. Without
      # this, running ANY flow on the default macOS box fails with
      # "SSRF Protection: Hostname host.docker.internal resolves to blocked IP
      # address(es)" — the box's own Studio cannot reach the box's own model.
      # These two names are the box's, not user input; nothing else is allowed.
      LANGFLOW_SSRF_ALLOWED_HOSTS: host.docker.internal,ollama
      # The routines read the department drives below. The Directory component
      # confines itself to its working directory plus this allow-list
      # (lfx/components/files_and_knowledge/directory.py: _allowed_roots), so
      # without this every drive-reading routine fails with "Directory path
      # escapes the allowed root" while the mount sits there, correct and
      # unreadable. Read-only, and only this one root: the flows may read the
      # shared drives and nothing else on the box.
      LANGFLOW_DIRECTORY_COMPONENT_ALLOWED_ROOTS: /drives
    volumes:
      - caddy-data:/caddy:ro
      - studio-data:/app/langflow
      # The same folders Samba shares and the ingest daemon watches, so a
      # routine answers from the file a person dropped on the drive minutes
      # ago. Read-only: a flow is authored by a person and must not be able to
      # rewrite the department's documents.
      - ${NUFI_DATA_DIR}/drives:/drives:ro
      - ./scripts/studio-entrypoint.sh:/usr/local/bin/studio-entrypoint.sh:ro
    entrypoint: ["/usr/local/bin/studio-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:7860/health_check\")' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 90s
    networks: [box]

  # ---------------------------------------------------------------------------
  # Watches the department drives and ingests documents into the chat app's
  # RAG store, acting as the ingest service account created by the installer.
  # ---------------------------------------------------------------------------
  nufi-ingest:
    logging: *box-logging
    image: ${NUFI_REGISTRY:-ghcr.io/dudaji-vn}/nufi-ingest:${NUFI_INGEST_TAG}
    restart: unless-stopped
    depends_on:
      librechat:
        condition: service_healthy
    environment:
      NUFI_APP_URL: http://librechat:3080
      NUFI_INGEST_EMAIL: ${INGEST_EMAIL}
      NUFI_INGEST_PASSWORD: ${INGEST_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      NUFI_DRIVES_DIR: /drives
      NUFI_STATE_DIR: /state
      NUFI_MODEL: ${NUFI_MODEL}
      NUFI_PROVIDER: NuFi
      NUFI_INGEST_INTERVAL: "20"
      NUFI_INGEST_SHARE: team
    volumes:
      - ${NUFI_DATA_DIR}/drives:/drives:ro
      - ingest-state:/state
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$(find /state/heartbeat -mmin -3 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks: [box]

  # Scheduled department routines. Inert until data/schedules.ini exists, so an
  # existing box gains a stopped-empty scheduler and behaves exactly as before.
  nufi-cron:
    logging: *box-logging
    image: ${NUFI_REGISTRY:-ghcr.io/dudaji-vn}/nufi-cron:${NUFI_CRON_TAG:-main}
    restart: unless-stopped
    depends_on:
      studio:
        condition: service_healthy
    environment:
      NUFI_STUDIO_URL: http://studio:7860
      STUDIO_API_KEY: ${STUDIO_API_KEY}
      NUFI_DRIVES_DIR: /drives
      NUFI_STATE_DIR: /state
      NUFI_SCHEDULES: /config/schedules.ini
      NUFI_CRON_TICK_INTERVAL: "20"
      NUFI_CRON_RUN_TIMEOUT: "900"
    volumes:
      # Read-write, unlike nufi-ingest's mount: a routine's whole point is the
      # file it leaves on the department's drive. It only ever writes inside
      # _routines/, and `out` is validated as a bare file name so a schedule
      # cannot be edited into a path that climbs out of the drive.
      - ${NUFI_DATA_DIR}/drives:/drives
      # The data directory, not the file: binding a path docker cannot find
      # makes an empty DIRECTORY of that name, so a box with no schedules yet
      # would grow a `schedules.ini/` folder and the daemon would read nothing
      # while the box looked configured. Read-only, and the daemon opens one
      # file inside it.
      - ${NUFI_DATA_DIR}:/config:ro
      - cron-state:/state
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$(find /state/heartbeat -mmin -3 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [box]

  # NUFI Works: the server behind :3003, and the one service on the box that
  # holds the Docker socket -- it creates every sandbox as a sibling container
  # under runsc on the works-sandbox network, and never runs agent code itself
  # (its upstream Local environment is archived by `nufi-box works install`).
  # The socket is a real grant: whoever holds it can start any container on
  # the box as root. It is accepted here because there is no other way for a
  # container to create sibling containers, and it is stated in the README.
  works:
    profiles: [works]
    image: ${NUFI_REGISTRY:-ghcr.io/dudaji-vn}/nufi-works:${NUFI_WORKS_TAG:-main}
    restart: unless-stopped
    logging: *box-logging
    # uid 1000 from the start, not root-then-gosu: upstream's entrypoint drops
    # privileges with gosu, and gosu resets supplementary groups -- the docker
    # group group_add hands the container would not reach the plugin worker
    # that opens the socket. As 1000 the entrypoint execs directly and the
    # group survives. DOCKER_GID is read from the socket by install-box.sh.
    user: "1000:1000"
    group_add: ["${DOCKER_GID:-999}"]
    depends_on:
      postgres:
        condition: service_healthy
      console:
        condition: service_healthy
      caddy:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nufi:${POSTGRES_PASSWORD}@postgres:5432/nufi_works
      BETTER_AUTH_SECRET: ${WORKS_AUTH_SECRET}
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      # private: the first signed-in browser session may claim instance admin.
      # `nufi-box works install` is that session -- signed in as the box admin
      # through the console, exactly as a browser would be.
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: https://${BOX_HOST}:3003
      # The box's own registry (works/adapters.json): every harness on
      # litellm-proxy. Replace semantics -- what is not in the file is not
      # offered.
      PAPERCLIP_ADAPTERS_FILE: /box/adapters.json
      # The provider ships built in the image; a plugin install must never
      # reach for npm from inside a box.
      PAPERCLIP_DISABLE_PLUGIN_AUTOBUILD: "1"
      # Members arrive through the console (SSO). No password sign-ups: on a
      # LAN box, a password account registered under a colleague's address
      # before that colleague first signs in would be theirs to keep.
      PAPERCLIP_AUTH_DISABLE_SIGN_UP: "true"
      NUFI_OIDC_ISSUER: https://${BOX_HOST}:3001
      NUFI_OIDC_CLIENT_ID: nufi-works
      NUFI_OIDC_CLIENT_SECRET: ${WORKS_OIDC_SECRET}
      # Fetched at start by works/entrypoint.sh from Caddy's :80 -- the caddy
      # volume's PKI directory is root-only and this container is uid 1000.
      NODE_EXTRA_CA_CERTS: /tmp/nufi-box-ca.crt
      # A LiteLLM virtual key minted by `nufi-box works install`, under the
      # three names the adapters read. Never the master key: this env reaches
      # every sandbox, and litellm-proxy is on the egress allow list.
      NUFI_MODEL_API_KEY: ${WORKS_MODEL_KEY:-}
      OPENAI_API_KEY: ${WORKS_MODEL_KEY:-}
      ANTHROPIC_API_KEY: ${WORKS_MODEL_KEY:-}
    volumes:
      - works-data:/paperclip
      - ./works/adapters.json:/box/adapters.json:ro
      - ./works/entrypoint.sh:/usr/local/bin/works-entrypoint.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/usr/local/bin/works-entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:3100/api/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [box]

  # The one way out of the sandbox network: a forward proxy that consults an
  # allow list and refuses everything else with a 403 it logs by hostname.
  # Behind the works profile with the server it serves; a box without --with-works has neither.
  works-egress:
    profiles: [works]
    image: ${NUFI_REGISTRY:-ghcr.io/dudaji-vn}/nufi-works-egress:${NUFI_WORKS_EGRESS_TAG:-main}
    restart: unless-stopped
    logging: *box-logging
    environment:
      # Bare hostnames, comma-separated, empty by default. `works` and
      # `litellm-proxy` are always allowed and the model host never is; see
      # works-egress/render.sh.
      WORKS_EGRESS_ALLOW: ${WORKS_EGRESS_ALLOW:-}
      # So the renderer can refuse the box's own name: on an ollama-profile
      # box it serves the model directly.
      BOX_HOST: ${BOX_HOST}
    healthcheck:
      # A config that lost its Filter directive proxies everything and looks
      # healthy by any liveness probe. The one answer that proves the filter
      # is loaded is a refusal, so ask for a host that is on no list and
      # expect the 403.
      test: ["CMD-SHELL", "http_proxy=http://127.0.0.1:3128 wget -S -T 5 -O /dev/null http://healthcheck.invalid/ 2>&1 | grep -q ' 403 '"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks: [box, works-sandbox]
