# Emulation layer — `install-box.sh --emulate-amd64`, or NUFI_EMULATE_AMD64=1 in
# .env (nufi-box reads it, so `nufi-box up` keeps the platform).
#
# Only nufi-works is published amd64-only (agents-image.yml), so it is the one
# service that needs forcing to linux/amd64 on an arm64 host. librechat and
# admin-panel are multi-arch (amd64 + arm64): pinning them to linux/amd64 ran
# their Node servers under emulation, where they segfaulted on Apple Silicon.
# Left alone they run their native arm64 build, so they are not listed here.
#
# On an Apple Silicon host the amd64 works server runs reliably under Rosetta
# (a Lima VM with rosetta.binfmt), not QEMU user-mode emulation. A real x86
# Linux box needs none of this file.
services:
  works:
    platform: linux/amd64
