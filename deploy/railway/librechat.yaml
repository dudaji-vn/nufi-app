version: 1.3.11
cache: true

interface:
  customWelcome: "Welcome to Nufi Chat."
  endpointsMenu: false
  modelSelect: true
  parameters: true
  sidePanel: true
  presets: true
  prompts: true
  bookmarks: true
  multiConvo: true
  temporaryChat: true
  agents: false

endpoints:
  custom:
    # Single OpenAI-compatible endpoint. Works with any backend that speaks the
    # OpenAI Chat Completions API: LiteLLM, vLLM, TGI, OpenAI itself, OpenRouter,
    # Together, Groq, Anthropic via a proxy, etc. Both values are interpolated
    # from the api container's env at runtime.
    - name: "Nufi"
      apiKey: "${BACKEND_API_KEY}"
      baseURL: "${BACKEND_BASE_URL}"
      models:
        fetch: true
        # Schema requires at least one entry (Zod min(1)) — a placeholder is
        # enough. When `fetch: true` returns a non-empty list, it overrides
        # this default (see loadConfigModels.js). The placeholder only shows
        # in the dropdown if the upstream models endpoint is unreachable.
        default: ["loading..."]
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Nufi"
      forcePrompt: false
      summarize: false

fileConfig:
  endpoints:
    Nufi:
      fileLimit: 5
      fileSizeLimit: 20
      totalSizeLimit: 50
      supportedMimeTypes:
        - "image/png"
        - "image/jpeg"
        - "image/webp"
        - "image/gif"
